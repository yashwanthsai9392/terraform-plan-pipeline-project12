name: Terraform Plan Pipeline

on:
  push:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Files
        run: |
          pwd
          ls -la
          find . -name "*.tf"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init .

      - name: Terraform Plan
        run: terraform plan -out=tfplan .
